<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="128" y1="96" x2="896" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#168CFF"/>
      <stop offset="0.52" stop-color="#0768D7"/>
      <stop offset="1" stop-color="#0047B3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(316 216) rotate(45) scale(690)" gradientUnits="userSpaceOnUse">
